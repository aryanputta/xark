name: ICICLE lockfile refresh
on:
  workflow_dispatch:
  push:
    branches: [review/cuda-icicle-g1-v05]
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: icicle-cargo-lock
          path: Cargo.lock
