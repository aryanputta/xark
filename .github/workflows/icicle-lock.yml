name: ICICLE lockfile refresh
on:
  workflow_dispatch:
  push:
    branches: [review/cuda-icicle-g1-v05]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: lock ICICLE adapter dependencies"
          git push origin HEAD:review/cuda-icicle-g1-v05
      - uses: actions/upload-artifact@v4
        with:
          name: icicle-cargo-lock
          path: Cargo.lock
