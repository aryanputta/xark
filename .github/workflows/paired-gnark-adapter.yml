name: Pinned Gnark adapter build

on:
  push:
    branches: [feat/paired-gnark-candidate]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: d807df8a6c9f2b1de15cc4aaf39f844cd8ba2e17
          path: adapter-source
      - uses: actions/checkout@v5
        with:
          ref: e838a62dd6206312c67c862fbe24cf96e7955bd3
          path: baseline-source
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: adapter-source/benches/privacy-rings-gnark/go.sum
      - name: Validate runner receipts
        run: python3 -m unittest discover -s benches/competitive -p test_run.py
      - name: Build pinned native and macOS adapters
        working-directory: adapter-source/benches/privacy-rings-gnark
        run: |
          out="$GITHUB_WORKSPACE/artifact"
          mkdir "$out"
          git rev-parse HEAD > "$out/source-commit.txt"
          sha256sum go.mod go.sum > "$out/module-inputs.sha256"
          go test -mod=readonly ./...
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o "$out/gnark-linux-amd64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -mod=readonly -trimpath -o "$out/gnark-darwin-amd64" .
          cd "$out"
          go version -m gnark-linux-amd64 gnark-darwin-amd64 > build-info.txt
          sha256sum gnark-linux-amd64 gnark-darwin-amd64 > SHA256SUMS
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the checked upstream 0.5 baseline
        working-directory: baseline-source
        run: |
          upstream=03a7f519d28df6718f7ce6dda41f1e57e5ea55db
          git fetch --no-tags --depth=1 origin "$upstream"
          test "$(git diff --name-only "$upstream" HEAD)" = crates/groth16/examples/bench_verified_warm.rs
          cargo build --locked --profile ci -p xark-groth16 --example bench_verified_warm
          out="$GITHUB_WORKSPACE/artifact"
          cp target/ci/examples/bench_verified_warm "$out/xark-v05-verified-linux-amd64"
          git rev-parse HEAD > "$out/baseline-source-commit.txt"
          rustc -vV > "$out/rustc.txt"
          cd "$out"
          sha256sum xark-v05-verified-linux-amd64 >> SHA256SUMS
      - name: Check the independent verifier with real Gnark proofs
        run: |
          cargo test --locked --profile ci -p xark-groth16 --example verify_gnark_receipt
          cargo build --locked --profile ci -p xark-groth16 --example verify_gnark_receipt
          fixture="$RUNNER_TEMP/interop"
          python3 benches/competitive/make_gnark_interop_fixture.py "$fixture"
          GNARK_PROOF_RECEIPT="$fixture/proofs.json" artifact/gnark-linux-amd64 \
            "$fixture/circuit.r1cs" "$fixture/witness.wtns" \
            "$fixture/public.json" "$fixture/public-changed.json" 2 2 1
          target/ci/examples/verify_gnark_receipt "$fixture/proofs.json" \
            "$fixture/public.json" "$fixture/public-changed.json" 3
          if target/ci/examples/verify_gnark_receipt "$fixture/proofs.json" \
            "$fixture/public-changed.json" "$fixture/public.json" 3; then
            echo 'unexpectedly accepted the altered statement' >&2
            exit 1
          fi
          cp target/ci/examples/verify_gnark_receipt artifact/verify-gnark-linux-amd64
          (cd artifact && sha256sum verify-gnark-linux-amd64 >> SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-gnark-adapters
          path: artifact/
