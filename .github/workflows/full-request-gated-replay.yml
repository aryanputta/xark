name: Full request replay gate

on:
  push:
    branches: [bench/full-request-gated-replay]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.15.9
      - run: python -m unittest discover -s benches/full_request -p 'test_*.py' -v
      - run: ruff check benches/full_request/host_control.py benches/full_request/replay.py benches/full_request/test_host_control.py benches/full_request/test_replay.py
      - run: ruff format --check benches/full_request/host_control.py benches/full_request/replay.py benches/full_request/test_host_control.py benches/full_request/test_replay.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --locked -p xark-groth16 --test prover
