name: Shared B scalar Linux correctness

on:
  push:
    branches:
      - perf/request-local-b-scalars
      - perf/g2-public-validation
      - perf/g2-gls-boxed-scratch
      - test/g2-resident-request-batches
      - perf/resident-stream-solver
      - perf/compact-resident-stream-solver
      - perf/sparse-resident-solver-metadata

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --profile ci -p xark-ir --lib --test reduced_soundness
      - name: Test full proofs on source-generated inputs and check the benchmark
        run: |
          features=msm-b-shared-bench,msm-g2-shifted-bench,msm-g2-endpoint-bench
          cargo test --locked --profile ci -p xark-groth16 --features "$features" --test prover
          cargo test --locked --profile ci -p xark-groth16 --features "$features" --example bench_prove
          cargo clippy --locked -p xark-groth16 --features "$features" --test prover --example bench_prove -- -D warnings
      - name: Check normal feature configuration
        run: cargo check --locked -p xark-groth16 --example bench_prove
