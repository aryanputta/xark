name: Competitive benchmark build checks

on:
  push:
    branches:
      - feat/competitive-build-provenance
  pull_request:
    paths:
      - benches/competitive/**
      - .github/workflows/competitive-build-check.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: python -m pip install ruff==0.15.9
      - run: python -m json.tool benches/competitive/config.example.json > /dev/null
      - run: python -m unittest discover -s benches/competitive -p 'test_*.py' -v
      - run: ruff check benches/competitive/build_xark.py benches/competitive/run.py benches/competitive/test_build_xark.py
      - run: ruff format --check benches/competitive/build_xark.py benches/competitive/run.py benches/competitive/test_build_xark.py
      - run: cargo fmt --all --check
      - run: cargo test --locked -p xark-groth16 --test prover
      - run: cargo clippy --locked -p xark-groth16 --all-targets -- -D warnings
