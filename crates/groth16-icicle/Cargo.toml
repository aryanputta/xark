[package]
name = "xark-groth16-icicle"
description = "Optional ICICLE CUDA G1 MSM adapter for Xark's Groth16 accelerator interface"
keywords = ["zero-knowledge", "groth16", "gpu", "cuda", "icicle"]
categories = ["cryptography"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
xark-groth16 = { path = "../groth16", version = "0.5.0" }
ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-ec = { version = "0.6", default-features = false, features = ["std"] }
ark-ff = { version = "0.6", default-features = false, features = ["std"] }
ark-serialize = { version = "0.6", default-features = false, features = ["std"] }
rayon = "1"
icicle-bn254 = { git = "https://github.com/ingonyama-zk/icicle.git", rev = "6c77775961b0e4dc2be359feec1ac11536c18043", default-features = false, features = ["msm"] }
icicle-core = { git = "https://github.com/ingonyama-zk/icicle.git", rev = "6c77775961b0e4dc2be359feec1ac11536c18043" }
icicle-runtime = { git = "https://github.com/ingonyama-zk/icicle.git", rev = "6c77775961b0e4dc2be359feec1ac11536c18043" }

[dev-dependencies]
rand = "0.8"
rand_chacha = { version = "0.3", default-features = false }
xark-ir = { path = "../ir", version = "0.5.0" }

[lints]
workspace = true
